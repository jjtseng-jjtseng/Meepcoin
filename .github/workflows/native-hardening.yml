name: Native currency hardening
on:
  push:
    branches: ['codex/native-hardening-*', 'codex/browser-wallet-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-hardening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  currency:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ephemeral runner dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake g++ pkg-config libboost-all-dev libssl-dev libunbound-dev libzmq3-dev libsodium-dev
      - name: Verify published participant imports and pinned browser assets
        run: node scripts/private/verify-participant-assets.mjs
      - name: HTTPS gateway authorization, stop, expiry and outage boundaries
        run: node --test --test-concurrency=1 pool/private/tests/experiment.test.mjs pool/private/tests/gateway.test.mjs pool/private/tests/page_lifecycle.test.mjs pool/private/tests/testnet_service.test.mjs
      - name: Build node, wallets and real LMDB storage tests
        run: python3 scripts/private/build-native.py "$RUNNER_TEMP/meep-native" --hardening-tests
      - name: Currency, adversarial amounts, duplicate relay and crash restore
        run: python3 scripts/private/verify-currency.py --binaries "$RUNNER_TEMP/meep-native/build/bin" --run-dir "$RUNNER_TEMP/meep-currency" --adversarial --crash-restore --seed-restore
      - name: Local wallet boundary and interrupted-payment checks
        run: python3 -m unittest discover -s wallet -p test_companion.py -v
      - name: Real native wallet companion create, transfer and seed recovery
        run: python3 wallet/verify_native.py --binaries "$RUNNER_TEMP/meep-native/build/bin" --run-dir "$RUNNER_TEMP/meep-local-wallet"
      - name: Three-peer partition, higher-work reorganization and malformed frames
        run: python3 scripts/private/verify-peers.py --binaries "$RUNNER_TEMP/meep-native/build/bin" --run-dir "$RUNNER_TEMP/meep-peers" --extended
      - name: Real Chromium wallet creation, mining reward, payment and recovery
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          npm install --prefix "$RUNNER_TEMP/participant-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          sudo systemd-run --wait --pipe --collect \
            --unit="meepcoin-participant-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --working-directory="$GITHUB_WORKSPACE" \
            --property=CPUQuota=100% --property=TasksMax=192 --property=Nice=10 \
            --property=RuntimeMaxSec=1200 --property=KillMode=control-group --property=TimeoutStopSec=40 \
            /usr/bin/python3 "$GITHUB_WORKSPACE/wallet/verify_participant.py" \
            --binaries "$RUNNER_TEMP/meep-native/build/bin" \
            --native-hash "$RUNNER_TEMP/meep-native/pow-build/meepow-v2-hash" \
            --node "$(command -v node)" --run-dir "$RUNNER_TEMP/meep-participant" \
            --browser-binary /usr/bin/google-chrome --max-rss-mib 2048 \
            --playwright-module "$RUNNER_TEMP/participant-browser/node_modules/playwright-core/index.mjs"
      - name: Retain qualification receipts without wallet files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification-${{ matrix.runner }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/meep-native/*.json
            ${{ runner.temp }}/meep-native/alt-storage.log
            ${{ runner.temp }}/meep-native/kat-v2.log
            ${{ runner.temp }}/meep-currency/RESULT.json
            ${{ runner.temp }}/meep-currency/CLEANUP.json
            ${{ runner.temp }}/meep-peers/RESULT.json
            ${{ runner.temp }}/meep-peers/CLEANUP.json
            ${{ runner.temp }}/meep-local-wallet/RESULT.json
            ${{ runner.temp }}/meep-local-wallet/CLEANUP.json
            ${{ runner.temp }}/meep-participant/RESULT.json
            ${{ runner.temp }}/meep-participant/CLEANUP.json
            ${{ runner.temp }}/meep-participant/BROWSER_RESULT.json
            ${{ runner.temp }}/meep-participant/BROWSER_MINED.png
            ${{ runner.temp }}/meep-participant/BROWSER_REWARD.png
            ${{ runner.temp }}/meep-participant/BROWSER_RECEIVED.png
  portable-pow:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cmake -S meepow -B pow-build -DCMAKE_BUILD_TYPE=Release -DMEEPOW_BLAKE3_PORTABLE=ON
      - run: cmake --build pow-build --config Release --target meepow-kat-v2-api meepow-target-math --parallel 2
      - run: ctest --test-dir pow-build -C Release -R '^(kat_v2_api|target_math)$' --output-on-failure
